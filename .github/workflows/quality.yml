name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Compile source
        run: python -m compileall -q src app.py app_st.py
      - name: Run offline tests
        run: pytest
      - name: Audit repository contents
        run: python scripts/audit_repository.py
